spring.application.name=fintrack-api

# Default: in-memory H2 so the app runs with zero setup. Use the "mysql" profile for MySQL.
spring.datasource.url=jdbc:h2:mem:fintrack;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# JWT: override APP_JWT_SECRET in any real deployment (min 32 characters)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-32chars!!}
app.jwt.expiration-ms=3600000
